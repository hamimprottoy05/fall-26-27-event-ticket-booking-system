<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose your seats and book tickets on EventNest">
  <title>Booking | EventNest</title>
  <link rel="stylesheet" href="css/customer.css">
</head>

<body>

  <header class="header">
    <a href="events.html" class="logo">Event<span>Nest</span></a>
    <div class="user-info">
      <span class="badge student">Customer</span>
      <span>Welcome</span>
      <a href="login.html" class="btn btn-small btn-light">Logout</a>
    </div>
  </header>

  <nav class="topnav">
    <a href="events.html">Events</a>
    <a href="my-tickets.html">My Tickets</a>
  </nav>

  <main class="container">

    <div id="bookingMessage" class="message"></div>

    <section id="bookingSection" class="page-section">
      <h2 class="page-title" id="bookingTitle"></h2>
      <p class="page-subtitle" id="bookingInfo"></p>

      <!-- =========================================================
           UNIQUE FEATURE 1: INTERACTIVE SEAT SELECTION
           ========================================================= -->
      <div class="row">
        <div class="col-wide">
          <div class="card">
            <h3>Choose your seats</h3>
            <div class="stage">STAGE</div>
            <div class="seat-map" id="seatMap"></div>

            <div class="legend">
              <span><span class="legend-box available"></span>Available</span>
              <span><span class="legend-box booked"></span>Booked</span>
              <span><span class="legend-box selected"></span>Selected</span>
            </div>
            <span class="error" id="seatsError"></span>
          </div>
        </div>

        <div class="col">
          <div class="card">
            <h3>Your booking</h3>
            <form id="bookingForm" onsubmit="return confirmBooking()">
              <fieldset>
                <legend>Ticket holder</legend>
                <table class="form-table">
                  <tr>
                    <td><label for="holderName">Name:</label></td>
                    <td>
                      <input type="text" id="holderName" placeholder="Name on the ticket">
                      <span class="error" id="holderNameError"></span>
                    </td>
                  </tr>
                  <tr>
                    <td><label for="holderPhone">Phone:</label></td>
                    <td>
                      <input type="tel" id="holderPhone" placeholder="11 digits, e.g. 01712345678">
                      <span class="error" id="holderPhoneError"></span>
                    </td>
                  </tr>
                </table>
              </fieldset>

              <div class="result-box" id="bookingSummary"></div>
              <p class="hint">You can book up to <span id="maxSeatsText"></span> seats at a time.</p>

              <input type="submit" class="btn btn-success" value="Confirm Booking">
              <button type="button" class="btn btn-secondary" onclick="clearSelection()">Clear Seats</button>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    &copy; 2026 EventNest &middot; Event and Ticket Booking System
  </footer>

  <script src="js/customer-data.js"></script>
  <script src="js/customer-common.js"></script>
  <script src="js/customer-booking.js"></script>
</body>

</html>
