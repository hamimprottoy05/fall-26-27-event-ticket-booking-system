<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to EventNest">
  <title>Login | EventNest</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" id="siteLogo">EventNest</a>
    <div class="user-info">
      <a href="login.html" class="btn btn-small btn-light">Login</a>
      <a href="register.html" class="btn btn-small">Register</a>
    </div>
  </header>

  <nav class="topnav">
    <a href="index.html">Home</a>
    <a href="index.html#events">Browse Events</a>
    <a href="index.html#who">Who It's For</a>
    <a href="index.html#how">How It Works</a>
    <a href="index.html#refunds">Refunds</a>
    <a href="index.html#contact">Contact Us</a>
  </nav>

  <main class="container">
    <div class="auth-box">

      <div class="card">
        <h2 class="page-title">Welcome back</h2>
        <p class="page-subtitle">One login for everyone. We will open the right dashboard for your account.</p>

        <div id="loginMessage" class="message"></div>

        <!--
          onsubmit="return validateLogin()"
          return false -> the form is NOT sent, the user stays here
          return true  -> the browser opens the page written in "action".
          JavaScript sets the action to admin.html for an Admin account.

          The password input has NO name attribute, so it is never put in the URL (method="get").
          With the PHP backend this becomes method="post" with name="password".
        -->
        <form id="loginForm" action="index.html" method="get" onsubmit="return validateLogin()">
          <fieldset>
            <legend>Your account</legend>
            <table class="form-table">
              <tr>
                <td><label for="username">Username or Email:</label></td>
                <td>
                  <input type="text" id="username" name="username" placeholder="e.g. admin or admin@eventnest.com">
                  <span class="error" id="usernameError"></span>
                </td>
              </tr>
              <tr>
                <td><label for="password">Password:</label></td>
                <td>
                  <input type="password" id="password" placeholder="Your password">
                  <span class="error" id="passwordError"></span>
                  <input type="checkbox" id="showPassword" onchange="togglePassword()">
                  <label for="showPassword" class="option-label">Show password</label>
                </td>
              </tr>
            </table>
          </fieldset>

          <input type="submit" class="btn btn-block" value="Login">
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
      </div>

    </div>
  </main>

  <footer class="footer">
    &copy; 2026 <span id="footerName">EventNest</span> &middot; Event &amp; Ticket Booking System
  </footer>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
